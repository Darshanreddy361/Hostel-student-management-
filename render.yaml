services:
  - type: web
    name: nie-hostel-portal-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 wsgi:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/hostel.db
      - key: RECEIPT_UPLOAD_DIR
        value: /tmp/hostel-receipts
      - key: SESSION_COOKIE_SECURE
        value: "true"
