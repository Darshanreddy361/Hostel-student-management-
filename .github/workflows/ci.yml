
name: Hostel Room Allocation CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test Flask Application

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python Syntax
        run: |
          python -m py_compile app.py

      - name: Test Flask Application
        run: |
          python -c "from app import app, init_db; init_db(); client = app.test_client(); response = client.get('/'); assert response.status_code == 200; print('Flask application test passed')"
